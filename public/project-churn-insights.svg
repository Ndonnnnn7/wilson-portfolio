<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Customer churn insight detail</title>
  <desc id="description">An analytics screen showing customer risk factors, segment comparisons, and a recommended retention action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d5e7fa"/>
      <stop offset="1" stop-color="#fff1cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#081f5c" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <circle cx="1100" cy="690" r="260" fill="#7096d1" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="58" width="1056" height="634" rx="30" fill="#f8fbff"/>
  </g>
  <rect x="72" y="58" width="1056" height="94" rx="30" fill="#081f5c"/>
  <rect x="72" y="120" width="1056" height="32" fill="#081f5c"/>
  <circle cx="124" cy="105" r="18" fill="#bad6eb"/>
  <text x="160" y="113" fill="#fff" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700">Customer risk explorer</text>
  <rect x="922" y="87" width="158" height="39" rx="19.5" fill="#334eac"/>
  <text x="1001" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Export insight</text>
  <text x="112" y="208" fill="#081f5c" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700">Why customers may leave</text>
  <text x="112" y="239" fill="#47638f" font-family="Segoe UI, sans-serif" font-size="15">Model signals ranked by their influence on churn risk</text>
  <rect x="112" y="278" width="514" height="342" rx="24" fill="#fff" stroke="#d8e5f5"/>
  <g font-family="Segoe UI, sans-serif" font-size="15" fill="#183669">
    <text x="148" y="333" font-weight="600">Monthly contract</text>
    <rect x="148" y="348" width="420" height="18" rx="9" fill="#edf3fb"/>
    <rect x="148" y="348" width="367" height="18" rx="9" fill="#334eac"/>
    <text x="148" y="416" font-weight="600">Support requests</text>
    <rect x="148" y="431" width="420" height="18" rx="9" fill="#edf3fb"/>
    <rect x="148" y="431" width="294" height="18" rx="9" fill="#7096d1"/>
    <text x="148" y="499" font-weight="600">Recent price change</text>
    <rect x="148" y="514" width="420" height="18" rx="9" fill="#edf3fb"/>
    <rect x="148" y="514" width="218" height="18" rx="9" fill="#bad6eb"/>
    <text x="148" y="582" font-weight="600">Low product usage</text>
    <rect x="148" y="597" width="420" height="18" rx="9" fill="#edf3fb"/>
    <rect x="148" y="597" width="176" height="18" rx="9" fill="#9dbbe3"/>
  </g>
  <rect x="656" y="278" width="432" height="158" rx="24" fill="#e6f1ff"/>
  <text x="688" y="322" fill="#47638f" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">HIGH-RISK SEGMENT</text>
  <text x="688" y="369" fill="#081f5c" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">1,294 customers</text>
  <text x="688" y="402" fill="#47638f" font-family="Segoe UI, sans-serif" font-size="15">Worth an estimated $86K monthly</text>
  <rect x="656" y="460" width="432" height="160" rx="24" fill="#fff2d3"/>
  <circle cx="708" cy="512" r="22" fill="#334eac"/>
  <path d="M698 512 l7 7 14-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="746" y="507" fill="#7b6541" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">RECOMMENDED ACTION</text>
  <text x="688" y="554" fill="#081f5c" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Offer a guided annual plan</text>
  <text x="688" y="584" fill="#47638f" font-family="Segoe UI, sans-serif" font-size="14">Prioritize customers with repeated support requests.</text>
</svg>
