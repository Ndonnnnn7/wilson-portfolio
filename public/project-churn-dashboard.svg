<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Customer churn dashboard overview</title>
  <desc id="description">A blue analytics dashboard with customer statistics, a retention trend, and risk segments.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#b9d4f1"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7096d1"/>
      <stop offset="1" stop-color="#334eac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#081f5c" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <circle cx="1090" cy="80" r="230" fill="#fff" opacity=".28"/>
  <circle cx="90" cy="710" r="250" fill="#7096d1" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="58" width="1056" height="634" rx="30" fill="#f8fbff"/>
  </g>
  <rect x="72" y="58" width="222" height="634" rx="30" fill="#081f5c"/>
  <circle cx="120" cy="112" r="19" fill="#bad6eb"/>
  <rect x="153" y="98" width="91" height="13" rx="6.5" fill="#fff"/>
  <rect x="153" y="121" width="57" height="8" rx="4" fill="#7096d1"/>
  <g fill="#fff" opacity=".86">
    <rect x="111" y="192" width="118" height="12" rx="6"/>
    <rect x="111" y="246" width="86" height="12" rx="6" opacity=".55"/>
    <rect x="111" y="300" width="103" height="12" rx="6" opacity=".55"/>
    <rect x="111" y="354" width="74" height="12" rx="6" opacity=".55"/>
  </g>
  <text x="342" y="120" fill="#081f5c" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Churn overview</text>
  <text x="342" y="153" fill="#47638f" font-family="Segoe UI, sans-serif" font-size="15">Customer health at a glance</text>
  <g font-family="Segoe UI, sans-serif">
    <g>
      <rect x="342" y="190" width="215" height="118" rx="20" fill="#e6f1ff"/>
      <text x="368" y="225" fill="#47638f" font-size="14">Customers</text>
      <text x="368" y="273" fill="#081f5c" font-size="37" font-weight="700">12,480</text>
    </g>
    <g>
      <rect x="578" y="190" width="215" height="118" rx="20" fill="#fff1d3"/>
      <text x="604" y="225" fill="#7b6541" font-size="14">At-risk</text>
      <text x="604" y="273" fill="#081f5c" font-size="37" font-weight="700">18.4%</text>
    </g>
    <g>
      <rect x="814" y="190" width="250" height="118" rx="20" fill="#e6f5ee"/>
      <text x="840" y="225" fill="#3c715b" font-size="14">Retention</text>
      <text x="840" y="273" fill="#081f5c" font-size="37" font-weight="700">+8.2%</text>
    </g>
  </g>
  <rect x="342" y="338" width="470" height="292" rx="23" fill="#fff" stroke="#d8e5f5"/>
  <text x="372" y="382" fill="#081f5c" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Retention trend</text>
  <g stroke="#dce8f7" stroke-width="2">
    <line x1="375" y1="436" x2="777" y2="436"/>
    <line x1="375" y1="496" x2="777" y2="496"/>
    <line x1="375" y1="556" x2="777" y2="556"/>
  </g>
  <path d="M380 555 C430 530 450 542 495 500 S575 510 620 456 S710 462 773 408" fill="none" stroke="url(#chart)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#334eac">
    <circle cx="380" cy="555" r="8"/><circle cx="495" cy="500" r="8"/><circle cx="620" cy="456" r="8"/><circle cx="773" cy="408" r="8"/>
  </g>
  <rect x="837" y="338" width="227" height="292" rx="23" fill="#081f5c"/>
  <text x="867" y="382" fill="#fff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Risk groups</text>
  <circle cx="950" cy="489" r="69" fill="none" stroke="#274480" stroke-width="32"/>
  <path d="M950 420 A69 69 0 0 1 1012 519" fill="none" stroke="#bad6eb" stroke-width="32" stroke-linecap="round"/>
  <text x="950" y="495" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">18%</text>
  <rect x="876" y="586" width="148" height="10" rx="5" fill="#7096d1"/>
</svg>
